<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHW Accounts - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CC Risk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main>
  <div class="card">
    <h1>Register New CHW</h1>
    <div id="msgForm" class="hidden"></div>
    <form id="register" novalidate>
      <label for="name">Full name</label>
      <input id="name" type="text" required>
      <label for="phone">Phone number</label>
      <input id="phone" type="tel" placeholder="07XX XXX XXX" required>
      <label for="chu">Community Health Unit (CHU)</label>
      <input id="chu" type="text" placeholder="e.g. Kiambaa" required>
      <div class="actions"><button type="submit">Create Account</button></div>
    </form>
    <div id="creds" class="alert info hidden">
      <strong>Account created. Share these details with the CHW in person.</strong>
      <div class="credentials" id="credText"></div>
      <p class="muted" id="credNote"></p>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">CHW Accounts</h2>
    <div id="msg" class="hidden"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Username</th><th>CHU</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted hidden">No CHW accounts yet.</p>
  </div>
</main>
<script src="js/api.js"></script>
<script>
if (requireLogin("ADMIN")) {
  renderNav("admin.html");
  const msg = document.getElementById("msg");

  function showCredentials(c, heading) {
    document.querySelector("#creds strong").textContent = heading;
    document.getElementById("credText").textContent = `Username: ${c.username}\nTemporary password: ${c.temporary_password}`;
    document.getElementById("credText").style.whiteSpace = "pre-line";
    document.getElementById("credNote").textContent =
      `Shown once only. Expires ${formatDate(c.expires_at)}. The CHW must set a new password at first login.`;
    document.getElementById("creds").classList.remove("hidden");
    document.getElementById("creds").scrollIntoView({ behavior: "smooth" });
  }

  function actionButton(text, cls, handler) {
    const b = document.createElement("button");
    b.type = "button"; b.className = `small ${cls}`; b.textContent = text; b.onclick = handler;
    return b;
  }

  async function load() {
    try {
      const users = await api("GET", "/api/users");
      const body = document.getElementById("rows"); body.innerHTML = "";
      for (const u of users) {
        const tr = document.createElement("tr");
        const actions = document.createElement("div");
        actions.style.display = "flex"; actions.style.gap = ".35rem"; actions.style.flexWrap = "wrap";
        if (u.is_active) {
          actions.append(
            actionButton("Reset Password", "secondary", async () => {
              if (!confirm(`Issue a new temporary password to ${u.full_name}?`)) return;
              try { showCredentials(await api("POST", `/api/users/${u.user_id}/reset-password`),
                                    `New temporary password for ${u.full_name}. Share it in person.`); }
              catch (err) { showMessage(msg, err.message); }
            }),
            actionButton("Deactivate", "danger", async () => {
              if (!confirm(`Deactivate ${u.full_name}? They will no longer be able to log in. Their records are kept.`)) return;
              try { await api("POST", `/api/users/${u.user_id}/deactivate`); load(); }
              catch (err) { showMessage(msg, err.message); }
            }));
        } else {
          actions.append(actionButton("Reactivate", "secondary", async () => {
            try { await api("POST", `/api/users/${u.user_id}/reactivate`); load(); }
            catch (err) { showMessage(msg, err.message); }
          }));
        }
        tr.append(cell(u.full_name), cell(u.username), cell(u.chu_name), cell(u.is_active ? "Active" : "Inactive"),
                  cell(actions));
        body.appendChild(tr);
      }
      document.getElementById("empty").classList.toggle("hidden", users.length > 0);
    } catch (err) { showMessage(msg, err.message); }
  }

  document.getElementById("register").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    const m = document.getElementById("msgForm"); m.classList.add("hidden");
    try {
      const c = await api("POST", "/api/users", {
        full_name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.replace(/\s+/g, ""),
        chu_name: document.getElementById("chu").value.trim(),
      });
      e.target.reset();
      showCredentials(c, "Account created. Share these details with the CHW in person.");
      load();
    } catch (err) { showMessage(m, err.message); }
    finally { btn.disabled = false; }
  });
  load();
}
</script>
</body>
</html>
