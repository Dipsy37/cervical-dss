<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main class="center">
  <div class="card">
    <h1>Cervical Cancer Risk Assessment</h1>
    <p class="muted">Community Health Worker Portal</p>
    <div id="msg" class="hidden"></div>
    <form id="login" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="block" type="submit">Log In</button></div>
    </form>
    <p class="muted" style="margin-top:1rem">Forgot your password? Contact your System Administrator.</p>
    <button id="installApp" class="secondary block hidden" type="button">Install app on this phone</button>
  </div>
</main>
<script src="js/api.js"></script>
<script>
  const msg = document.getElementById("msg");
  if (new URLSearchParams(location.search).has("expired")) showMessage(msg, "Your session has ended. Please log in again.", "info");
  if (Session.token && !Session.mustChange) location.href = homeFor(Session.role);

  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try {
      const data = await api("POST", "/api/auth/login", {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      });
      Session.save(data);
      location.href = data.must_change_password ? "change-password.html" : homeFor(data.role);
    } catch (err) {
      showMessage(msg, err.message);
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
