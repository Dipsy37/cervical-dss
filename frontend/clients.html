<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clients - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CC Risk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main>
  <div class="card">
    <h1 id="heading">My Clients</h1>
    <p class="muted" id="intro">The clients you registered, most recently seen first.</p>
    <form id="filters" class="filters">
      <div><label for="search" id="searchLabel">Name or client code</label>
        <input id="search" type="text" placeholder="e.g. Mary or CL-00042" autocomplete="off"></div>
      <div class="hidden" id="chuBox"><label for="chu">CHU</label><input id="chu" type="text" placeholder="All units"></div>
      <div><button type="submit">Search</button></div>
    </form>
  </div>
  <div class="card">
    <div id="msg" class="hidden"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Age</th><th>Visits</th><th>Last visit</th><th>Last result</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted hidden">No clients found.</p>
  </div>
</main>
<script src="js/api.js"></script>
<script>
if (requireLogin()) {
  renderNav("clients.html");
  const isAdmin = Session.role === "ADMIN";
  if (isAdmin) {
    document.getElementById("heading").textContent = "Clients";
    document.getElementById("intro").textContent =
      "All registered clients. Names are shown as initials to protect privacy.";
    document.getElementById("searchLabel").textContent = "Client code";
    document.getElementById("search").placeholder = "e.g. CL-00042";
    document.getElementById("chuBox").classList.remove("hidden");
  }
  async function load() {
    const p = new URLSearchParams();
    const search = document.getElementById("search").value.trim(), chu = document.getElementById("chu").value.trim();
    if (search) p.set("search", search);
    if (isAdmin && chu) p.set("chu_name", chu);
    try {
      const rows = await api("GET", `/api/clients?${p}`);
      const body = document.getElementById("rows"); body.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr"), a = document.createElement("a");
        a.href = `client.html?code=${encodeURIComponent(r.client_code)}`; a.textContent = "Open";
        const age = r.age == null ? "-" : `${r.age}${r.dob_estimated ? " (approx.)" : ""}`;
        tr.append(cell(clientLabel({ client_name: r.display_name, client_code: r.client_code })), cell(age),
                  cell(String(r.visits)), cell(r.last_assessed_at ? formatDate(r.last_assessed_at) : "None yet"),
                  cell(r.last_risk_level ? badge(r.last_risk_level) : "-"), cell(a));
        body.appendChild(tr);
      }
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
      document.getElementById("msg").classList.add("hidden");
    } catch (err) { showMessage(document.getElementById("msg"), err.message); }
  }
  document.getElementById("filters").onsubmit = (e) => { e.preventDefault(); load(); };
  load();
}
</script>
</body>
</html>
