<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessment Result - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CC Risk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main>
  <div id="msg" class="hidden"></div>
  <div id="result" class="hidden">
    <p class="muted"><span id="meta"></span></p>
    <div id="banner" class="risk-banner">
      <div>RISK LEVEL</div>
      <div class="level" id="level"></div>
      <div>Estimated risk score: <strong id="prob"></strong></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Recommended action</h2>
      <p id="referral"></p>
      <div id="notice" class="alert info hidden"></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Why this result?</h2>
      <p class="muted">The answers that most influenced this estimate:</p>
      <ol class="factors" id="factors"></ol>
    </div>
    <p class="disclaimer" id="disclaimer"></p>
    <div class="actions">
      <a class="button" id="again" href="assess.html">New Assessment</a>
      <a class="button secondary hidden" id="record" href="clients.html">Client Record</a>
      <a class="button secondary" id="home" href="chw.html">Back to Home</a>
    </div>
    <p class="muted" style="margin-top:1rem">Model version: <span id="version"></span></p>
  </div>
</main>
<script src="js/api.js"></script>
<script>
if (requireLogin()) {
  renderNav(Session.role === "ADMIN" ? "admin-assessments.html" : "history.html");
  if (Session.role === "ADMIN") {
    document.getElementById("again").classList.add("hidden");
    const h = document.getElementById("home"); h.href = "admin-assessments.html"; h.textContent = "Back to All Assessments";
  }
  const id = new URLSearchParams(location.search).get("id");
  api("GET", `/api/assessments/${encodeURIComponent(id)}`).then(r => {
    document.getElementById("meta").textContent =
      `Client ${clientLabel(r)}` + (r.age != null ? `, ${r.age} years${r.age_estimated ? " (approx.)" : ""}` : "") + " · " +
      `assessed ${formatDate(r.assessed_at)} by ${r.chw_name}`;
    if (r.guideline_notice) showMessage(document.getElementById("notice"), r.guideline_notice, "info");
    const rec = document.getElementById("record");
    rec.href = `client.html?code=${encodeURIComponent(r.client_code)}`; rec.classList.remove("hidden");
    document.getElementById("banner").classList.add(r.risk_level);
    document.getElementById("level").textContent = r.risk_level;
    document.getElementById("prob").textContent = r.probability.toFixed(2);
    document.getElementById("referral").textContent = r.referral_message;
    document.getElementById("disclaimer").textContent = r.disclaimer;
    document.getElementById("version").textContent = r.model_version;
    const list = document.getElementById("factors");
    for (const f of r.top_factors) {
      const li = document.createElement("li");
      const up = f.shap_value > 0;
      const [label] = f.plain_language_text.split(":");
      li.append(document.createTextNode(label + ": "));
      const s = document.createElement("span");
      s.className = up ? "up" : "down";
      s.textContent = up ? "increased the risk estimate" : "lowered the risk estimate";
      li.appendChild(s);
      list.appendChild(li);
    }
    document.getElementById("result").classList.remove("hidden");
  }).catch(err => showMessage(document.getElementById("msg"), err.message));
}
</script>
</body>
</html>
