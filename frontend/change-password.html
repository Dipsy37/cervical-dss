<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="center">
  <div class="card">
    <h1 id="heading">Change Password</h1>
    <p id="intro" class="muted">Choose a new password that only you know.</p>
    <div id="msg" class="hidden"></div>
    <form id="form" novalidate>
      <label for="current" id="currentLabel">Current password</label>
      <input id="current" type="password" autocomplete="current-password" required>
      <label for="new1">New password</label>
      <input id="new1" type="password" autocomplete="new-password" required>
      <label for="new2">Confirm new password</label>
      <input id="new2" type="password" autocomplete="new-password" required>
      <p class="muted">At least 8 characters, including letters and a number.</p>
      <div class="actions">
        <button type="submit">Save Password</button>
        <a id="cancel" class="button secondary" href="#">Cancel</a>
      </div>
    </form>
  </div>
</main>
<script src="js/api.js"></script>
<script>
  if (!Session.token) location.href = "index.html";
  const first = Session.mustChange;
  if (first) {
    document.getElementById("heading").textContent = "Set a New Password";
    document.getElementById("intro").textContent =
      "You are using a temporary password from the Administrator. Please set your own before continuing.";
    document.getElementById("currentLabel").textContent = "Temporary password";
    document.getElementById("cancel").textContent = "Log Out";
  }
  document.getElementById("cancel").onclick = (e) => {
    e.preventDefault();
    if (first) { Session.clear(); location.href = "index.html"; } else history.back();
  };

  const msg = document.getElementById("msg");
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const n1 = document.getElementById("new1").value, n2 = document.getElementById("new2").value;
    if (n1 !== n2) return showMessage(msg, "The two new passwords do not match.");
    const btn = e.submitter; btn.disabled = true;
    try {
      await api("POST", "/api/auth/change-password",
                { current_password: document.getElementById("current").value, new_password: n1 });
      Session.mustChange = false;
      showMessage(msg, "Password saved.", "ok");
      setTimeout(() => location.href = homeFor(Session.role), 700);
    } catch (err) { showMessage(msg, err.message); }
    finally { btn.disabled = false; }
  });
</script>
</body>
</html>
