<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Assessments - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main>
  <div class="card">
    <h1>All Assessment Records</h1>
    <p class="muted">Audit trail of every risk assessment, with the model version that produced it.</p>
    <form id="filters" class="filters">
      <div><label for="chw">CHW</label><select id="chw"><option value="">All CHWs</option></select></div>
      <div><label for="chu">CHU</label><input id="chu" type="text" placeholder="All units"></div>
      <div><label for="code">Client code</label><input id="code" type="text" placeholder="CL-00042"></div>
      <div><label for="level">Risk level</label>
        <select id="level"><option value="">All levels</option><option>LOW</option><option>MODERATE</option><option>HIGH</option></select></div>
      <div><button type="submit">Filter</button></div>
    </form>
  </div>
  <div class="card">
    <div id="msg" class="hidden"></div>
    <p class="muted" id="summary"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Client</th><th>CHW</th><th>CHU</th><th>Risk</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted hidden">No records match these filters.</p>
    <div class="actions">
      <button id="prev" class="secondary small" type="button">&lt; Previous</button>
      <button id="next" class="secondary small" type="button">Next &gt;</button>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script>
if (requireLogin("ADMIN")) {
  renderNav("admin-assessments.html");
  const PAGE = 25; let offset = 0;
  api("GET", "/api/users").then(users => {
    const sel = document.getElementById("chw");
    for (const u of users) { const o = document.createElement("option"); o.value = u.user_id; o.textContent = u.full_name; sel.appendChild(o); }
  }).catch(() => {});

  async function load() {
    const p = new URLSearchParams({ limit: PAGE, offset });
    for (const [id, key] of [["chw", "chw_id"], ["chu", "chu_name"], ["code", "client_code"], ["level", "risk_level"]]) {
      const v = document.getElementById(id).value.trim();
      if (v) p.set(key, v);
    }
    try {
      const rows = await api("GET", `/api/assessments?${p}`);
      const body = document.getElementById("rows"); body.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr"), a = document.createElement("a");
        a.href = `result.html?id=${r.assessment_id}`; a.textContent = "View";
        tr.append(cell(formatDate(r.assessed_at)), cell(r.client_code), cell(r.chw_name), cell(r.chu_name),
                  cell(badge(r.risk_level)), cell(a));
        body.appendChild(tr);
      }
      document.getElementById("summary").textContent = rows.length ? `Showing records ${offset + 1}-${offset + rows.length}` : "";
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
      document.getElementById("prev").disabled = offset === 0;
      document.getElementById("next").disabled = rows.length < PAGE;
    } catch (err) { showMessage(document.getElementById("msg"), err.message); }
  }
  document.getElementById("filters").onsubmit = (e) => { e.preventDefault(); offset = 0; load(); };
  document.getElementById("prev").onclick = () => { offset = Math.max(0, offset - PAGE); load(); };
  document.getElementById("next").onclick = () => { offset += PAGE; load(); };
  load();
}
</script>
</body>
</html>
