<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessment History - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CC Risk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main>
  <div class="card">
    <h1>Assessment History</h1>
    <form id="filters" class="filters">
      <div><label for="code">Client code</label><input id="code" type="text" placeholder="CL-00042"></div>
      <div><label for="level">Risk level</label>
        <select id="level"><option value="">All levels</option><option>LOW</option><option>MODERATE</option><option>HIGH</option></select></div>
      <div><button type="submit">Search</button></div>
    </form>
  </div>
  <div class="card">
    <div id="msg" class="hidden"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Client code</th><th>Risk level</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted hidden">No assessments found.</p>
    <div class="actions">
      <button id="prev" class="secondary small" type="button">&lt; Previous</button>
      <button id="next" class="secondary small" type="button">Next &gt;</button>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script>
if (requireLogin("CHW")) {
  renderNav("history.html");
  const PAGE = 20; let offset = 0;
  async function load() {
    const p = new URLSearchParams({ limit: PAGE, offset });
    const code = document.getElementById("code").value.trim(), level = document.getElementById("level").value;
    if (code) p.set("client_code", code);
    if (level) p.set("risk_level", level);
    try {
      const rows = await api("GET", `/api/assessments?${p}`);
      const body = document.getElementById("rows"); body.innerHTML = "";
      for (const r of rows) {
        const tr = document.createElement("tr"), a = document.createElement("a");
        a.href = `result.html?id=${r.assessment_id}`; a.textContent = "View";
        tr.append(cell(formatDate(r.assessed_at)), cell(r.client_code), cell(badge(r.risk_level)), cell(a));
        body.appendChild(tr);
      }
      document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
      document.getElementById("prev").disabled = offset === 0;
      document.getElementById("next").disabled = rows.length < PAGE;
    } catch (err) { showMessage(document.getElementById("msg"), err.message); }
  }
  document.getElementById("filters").onsubmit = (e) => { e.preventDefault(); offset = 0; load(); };
  document.getElementById("prev").onclick = () => { offset = Math.max(0, offset - PAGE); load(); };
  document.getElementById("next").onclick = () => { offset += PAGE; load(); };
  load();
}
</script>
</body>
</html>
