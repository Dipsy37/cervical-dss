<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#6b2d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CC Risk">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="js/pwa.js" defer></script>
</head>
<body>
<main>
  <h1>Dashboard</h1>
  <p class="muted">System-wide summary of risk assessments.</p>
  <div id="msg" class="hidden"></div>
  <div class="tiles" id="tiles"></div>
  <div class="grid-2">
    <div class="card"><h2 style="margin-top:0">Risk level distribution</h2><div id="levels"></div></div>
    <div class="card"><h2 style="margin-top:0">Assessments per day</h2><div id="daily"></div></div>
  </div>
  <div class="grid-2" style="margin-top:1rem">
    <div class="card">
      <h2 style="margin-top:0">By Community Health Unit</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>CHU</th><th>Low</th><th>Mod.</th><th>High</th><th>Total</th></tr></thead>
        <tbody id="chu"></tbody></table></div>
      <p id="chuEmpty" class="muted hidden">No assessments yet.</p>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Prediction model</h2>
      <ul class="model-list" id="model"></ul>
      <p class="muted" style="margin-top:.6rem">Estimates guide referral; they are not a diagnosis.</p>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
if (requireLogin("ADMIN")) {
  renderNav("dashboard.html");
  api("GET", "/api/dashboard/summary").then(s => {
    const high = s.by_level.HIGH, pctHigh = s.total_assessments ? Math.round(high / s.total_assessments * 100) : 0;
    document.getElementById("tiles").append(
      tile("Total assessments", s.total_assessments),
      tile("Clients assessed", s.clients_assessed),
      tile("High-risk referrals", high, `${pctHigh}% of assessments`),
      tile("Active CHWs", s.active_chws));
    riskBars(document.getElementById("levels"), s.by_level);
    dailyColumns(document.getElementById("daily"), s.per_day);
    const body = document.getElementById("chu");
    for (const r of s.by_chu) {
      const tr = document.createElement("tr");
      tr.append(cell(r.chu_name), cell(r.LOW), cell(r.MODERATE), cell(r.HIGH), cell(r.total));
      body.appendChild(tr);
    }
    document.getElementById("chuEmpty").classList.toggle("hidden", s.by_chu.length > 0);
    const m = s.model, list = document.getElementById("model");
    for (const [k, v] of [["Version", m.version], ["Trained on", m.trained_on],
                          ["Imbalance handling", (m.imbalance_method || "-").replace(" (scale_pos_weight)", "")],
                          ["Test AUC-ROC", m.test_auc != null ? m.test_auc.toFixed(2) : "-"],
                          ["Referral sensitivity (test)", m.referral_sensitivity != null ? Math.round(m.referral_sensitivity * 100) + "%" : "-"],
                          ["Risk cut-offs", `Moderate ≥ ${m.thresholds.t1.toFixed(2)} · High ≥ ${m.thresholds.t2.toFixed(2)}`]]) {
      const li = document.createElement("li");
      li.innerHTML = "<span></span><span></span>";
      li.children[0].textContent = k; li.children[1].textContent = v;
      list.appendChild(li);
    }
  }).catch(err => showMessage(document.getElementById("msg"), err.message));
}
</script>
</body>
</html>
