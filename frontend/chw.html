<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="card">
    <h1 id="welcome">Welcome</h1>
    <p class="muted" id="chu"></p>
    
  <div class="tiles" id="tiles"></div>
  <div class="grid-2">
    <div class="card"><h2 style="margin-top:0">My assessments by risk level</h2><div id="levels"></div></div>
    <div class="card"><h2 style="margin-top:0">My assessments per day</h2><div id="daily"></div></div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
  if (requireLogin("CHW")) {
    renderNav("chw.html");
    document.getElementById("welcome").textContent = `Welcome, ${Session.name}`;
    api("GET", "/api/auth/me").then(me => {
      document.getElementById("chu").textContent = me.chu_name ? `Community Health Unit: ${me.chu_name}` : "";
    }).catch(() => {});
    api("GET", "/api/dashboard/summary").then(s => {
      const pctHigh = s.total_assessments ? Math.round(s.by_level.HIGH / s.total_assessments * 100) : 0;
      document.getElementById("tiles").append(
        tile("My assessments", s.total_assessments),
        tile("Clients assessed", s.clients_assessed),
        tile("High-risk referrals", s.by_level.HIGH, `${pctHigh}% of my assessments`));
      riskBars(document.getElementById("levels"), s.by_level);
      dailyColumns(document.getElementById("daily"), s.per_day);
    }).catch(() => {});
  }
</script>
</body>
</html>
