<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Cervical Cancer Risk Assessment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="card">
    <h1 id="welcome">Welcome</h1>
    <p class="muted" id="chu"></p>
    <div class="actions"><a class="button" href="assess.html">+ New Risk Assessment</a></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="grid-2" style="margin-bottom:1rem">
    <div class="card"><h2 style="margin-top:0">My assessments by risk level</h2><div id="levels"></div></div>
    <div class="card"><h2 style="margin-top:0">My assessments per day</h2><div id="daily"></div></div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Recent assessments</h2>
    <div id="msg" class="hidden"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Client code</th><th>Risk level</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted hidden">No assessments recorded yet.</p>
    <p><a href="history.html">See full history</a></p>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
  if (requireLogin("CHW")) {
    renderNav("chw.html");
    document.getElementById("welcome").textContent = `Welcome, ${Session.name}`;
    api("GET", "/api/auth/me").then(me => {
      document.getElementById("chu").textContent = me.chu_name ? `Community Health Unit: ${me.chu_name}` : "";
    }).catch(() => {});
    api("GET", "/api/dashboard/summary").then(s => {
      const pctHigh = s.total_assessments ? Math.round(s.by_level.HIGH / s.total_assessments * 100) : 0;
      document.getElementById("tiles").append(
        tile("My assessments", s.total_assessments),
        tile("Clients assessed", s.clients_assessed),
        tile("High-risk referrals", s.by_level.HIGH, `${pctHigh}% of my assessments`));
      riskBars(document.getElementById("levels"), s.by_level);
      dailyColumns(document.getElementById("daily"), s.per_day);
    }).catch(() => {});
    api("GET", "/api/assessments?limit=5").then(rows => {
      const body = document.getElementById("rows");
      if (!rows.length) document.getElementById("empty").classList.remove("hidden");
      for (const r of rows) {
        const tr = document.createElement("tr");
        const link = document.createElement("a");
        link.href = `result.html?id=${r.assessment_id}`; link.textContent = "View";
        tr.append(cell(formatDate(r.assessed_at)), cell(r.client_code), cell(badge(r.risk_level)), cell(link));
        body.appendChild(tr);
      }
    }).catch(err => showMessage(document.getElementById("msg"), err.message));
  }
</script>
</body>
</html>
